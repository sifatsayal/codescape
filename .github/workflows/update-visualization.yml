name: Update Codebase Visualization

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'index.html'  # Ignore pushes that only change index.html (to prevent loops)
  workflow_dispatch:  # Allows manual triggering

jobs:
  update-visualization:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push changes back to the repository
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all history for proper git operations
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate visualization
        run: |
          python visualize_codebase.py --output index.html --no-server
      
      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Auto-update: Regenerate codebase visualization [skip actions]" || exit 0
          git push
      
      - name: No changes detected
        if: steps.verify-changed-files.outputs.changed == 'false'
        run: |
          echo "No changes to index.html detected. Visualization is up to date."
